blank_issues_enabled: false
contact_links:
  - name: Frequently asked questions
    url: https://github.com/alexeyw/knotwork/blob/main/docs/faq.md
    about: |
      Check the FAQ first — it covers what is supported, what deliberately
      is not, and where things live. docs/troubleshooting.md covers the
      failures that have already come up.
  - name: Report a security vulnerability
    url: https://github.com/alexeyw/knotwork/security/advisories/new
    about: |
      Please report suspected vulnerabilities privately through GitHub Security
      Advisories. See SECURITY.md for the threat model and what to include in a
      report. Do not open a public issue for security problems.
  - name: Questions and discussions
    url: https://github.com/alexeyw/knotwork/discussions
    about: |
      Use Discussions for open-ended questions, design proposals, and
      general feedback that does not fit a bug report or feature request.
