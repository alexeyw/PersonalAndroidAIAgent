# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Dedicated heap for the Kotlin compile daemon. The `distribution` product
# flavour dimension makes `./gradlew check` compile two flavours (`full` +
# `foss`) in one invocation; without an explicit heap the Kotlin daemon
# inherits a default that is too small for the doubled workload and fails with
# "Not enough memory to run compilation". 2 GiB is comfortable on the 16 GiB
# developer machines and the GitHub-hosted CI runner alike.
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# Reuse task outputs across builds (local and the setup-gradle CI cache). This
# helps the doubled `full` + `foss` workload by reusing shared upstream task
# outputs (e.g. the `:catalog` compilation both variants depend on) instead of
# recomputing them per variant and per run.
org.gradle.caching=true
# Parallel mode is intentionally left OFF: the `distribution` flavour dimension
# already doubles the compile workload, and overlapping module compiles would
# raise peak memory beyond what the 7 GiB GitHub-hosted runner tolerates
# alongside the 2 GiB Gradle + 2 GiB Kotlin daemons (the doubled workload was
# already at the edge of "Not enough memory to run compilation").
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
